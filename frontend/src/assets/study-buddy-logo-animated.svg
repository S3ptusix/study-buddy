<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    svg { background: transparent; }
    .body {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: bob 0.6s ease-in-out infinite;
    }
    .leg {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: stride 0.6s ease-in-out infinite;
    }
    .leg1 { animation-delay: 0s; }
    .leg2 { animation-delay: 0.15s; }
    .leg3 { animation-delay: 0.3s; }
    .leg4 { animation-delay: 0.45s; }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes stride {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-7px) scaleY(0.88); }
    }
  </style>

  <g class="body">
    <path d="M30 30V10H50V50H0V30H10L0 10H20L30 30Z" fill="white"/>
  </g>

  <g class="leg leg4">
    <path d="M100 60H80V40H100V60Z" fill="white"/>
  </g>

  <g class="leg leg1">
    <path d="M20 100H0L10 60H30L20 100Z" fill="white"/>
  </g>

  <g class="leg leg2">
    <path d="M60 100H40L30 60H50L60 100Z" fill="white"/>
  </g>

  <g class="leg leg3">
    <path d="M80 60L90 100H70L60 60H80Z" fill="white"/>
  </g>
</svg>
